{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-dark text-white"><h4>📍 Список філій</h4></div>
    <table class="table m-0">
        <thead><tr><th>Назва</th><th>Місто</th><th>Адреса</th><th>Статус</th></tr></thead>
        <tbody>
            {% for b in branches %}
            <tr><td><strong>{{ b.name }}</strong></td><td>{{ b.city }}</td><td>{{ b.address }}</td><td><span class="badge bg-success">{{ b.status }}</span></td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
